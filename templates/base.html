{% load static %}<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Vortex{% endblock %}</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@300;400;500;600;700&display=swap">
    {% block styles %}
    <link rel="stylesheet" href="{% static 'feed-style.css' %}">
    <link rel="stylesheet" href="{% static 'chat-style.css' %}">
    <link rel="stylesheet" href="{% static 'app.css' %}">
    {% endblock %}
    <script src="{% static 'js/app.js' %}"></script>
</head>
<body>
    {% if messages %}<div class="toasts">{% for message in messages %}<div class="toast {{ message.tags }}">{{ message }}</div>{% endfor %}</div>{% endif %}
    {% block body %}{% endblock %}
</body>
</html>
